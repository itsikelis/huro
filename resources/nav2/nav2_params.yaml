bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: map
    robot_base_frame: base
    odom_topic: /odom

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.0
    min_y_velocity_threshold: 0.0
    min_theta_velocity_threshold: 0.0
    odom_topic: /odom
    cmd_vel_topic: /cmd_vel_nav
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.001
      movement_time_allowance: 60.0
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: False
      xy_goal_tolerance: 0.5
      yaw_goal_tolerance: 0.5
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 56
      model_dt: 0.1
      batch_size: 2000
      iteration_count: 2
      temperature: 0.1
      transform_tolerance: 0.2
      # Use holonomic model so lateral velocity (vy) can be non-zero.
      motion_model: "Omni"
      critics: [
        "ConstraintCritic",
        "CostCritic",
        "PathAlignCritic",
        "PathFollowCritic",
        "PathAngleCritic",
        "GoalCritic",
        "GoalAngleCritic"
      ]
      ConstraintCritic:
        enabled: true
        cost_weight: 4.0
      CostCritic:
        enabled: true
        cost_weight: 8.0
        critical_cost: 300.0
        collision_cost: 1000000.0
        consider_footprint: true
        near_goal_distance: 1.0

planner_server:
  ros__parameters:
    allow_partial_planning: true
    use_sim_time: True
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      tolerance: 0.5
      allow_unknown: true

behavior_server:
  ros__parameters:
    use_sim_time: True
    global_frame: map
    robot_base_frame: base
    local_frame: odom
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"


local_costmap:
  local_costmap:
    ros__parameters:
      # Costmap uses Gazebo/ROS simulation clock.
      use_sim_time: True
      # Local costmap frame follows robot odometry (short-horizon obstacle avoidance).
      global_frame: odom
      # Robot body frame used for footprint and obstacle clearing around robot.
      robot_base_frame: base
      # Explicit rectangular footprint (x forward, y left) so width/length are used in planning.
      footprint: "[[0.36, 0.20], [0.36, -0.20], [-0.36, -0.20], [-0.36, 0.20]]"
      # Sliding window centered on robot (not a fixed global map).
      rolling_window: True
      # Additional safety margin around robot footprint.
      footprint_padding: 0.08
      # Window size in meters around the robot.
      width: 4
      height: 4
      # Cell size (m/cell): smaller = finer obstacles, higher CPU.
      resolution: 0.1
      # Layer order: obstacles are marked first, then inflated for safety buffer.
      plugins: ["obstacle_layer", "inflation_layer"]

      # ObstacleLayer: converts sensor observations into occupied cells.
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        # Master enable for this layer.
        enabled: True
        # Named observation source list (must match keys below).
        observation_sources: scan
        scan:
          # Input sensor topic (PointCloud2 from lidar bridge).
          topic: /utlidar/cloud
          # Sensor message type for this source.
          data_type: PointCloud2
          # Add obstacle hits to costmap.
          marking: True
          # Clear free space along rays (prevents stale obstacles).
          clearing: True
          # Marking distance limit from sensor origin (m).
          obstacle_max_range: 10.0
          # Clearing ray distance limit (m); usually >= obstacle_max_range.
          raytrace_max_range: 10.0
          # Ignore very near returns for marking (m).
          obstacle_min_range: 0.4
          # Ignore very near rays for clearing (m).
          raytrace_min_range: 0.4
          # Vertical filter (m in costmap frame): keep low curbs and near-floor points.
          min_obstacle_height: 0.0
          max_obstacle_height: 10.0

      # InflationLayer: expands obstacle costs around occupied cells.
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # Lower decay + larger radius => keep farther from walls.
        cost_scaling_factor: 2.0
        inflation_radius: 0.40

global_costmap:
  global_costmap:
    ros__parameters:
      # Global planner costmap anchored to map frame.
      use_sim_time: True
      global_frame: map
      robot_base_frame: base
      # Same footprint as local costmap for consistent collision checks.
      footprint: "[[0.36, 0.20], [0.36, -0.20], [-0.36, -0.20], [-0.36, 0.20]]"
      footprint_padding: 0.10
      map_vis_z: -0.0
      # Layer order for global planning map.
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      # StaticLayer: persistent occupancy map from SLAM/map server.
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        # 2D occupancy topic used as global base map.
        map_topic: /map 
        # Latch/transient semantics for static map delivery.
        map_subscribe_transient_local: True

      # Dynamic obstacles fused from live lidar cloud.
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /utlidar/cloud
          data_type: PointCloud2
          marking: True
          clearing: True
          # 0.1m made obstacle marking nearly disabled; restore useful range.
          obstacle_max_range: 10.0
          raytrace_max_range: 10.0
          obstacle_min_range: 0.4
          raytrace_min_range: 0.3
          min_obstacle_height: 0.0
          max_obstacle_height: 10.0

      # Keep global plans away from walls by adding a wider buffer than local map.
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.0
        inflation_radius: 0.70

map_server:
  ros__parameters:
    use_sim_time: True
    topic_name: /map 
    yaml_filename: ""   # on utilise la map de RTAB-Map, pas un fichier

amcl:
  ros__parameters:
    use_sim_time: True

lifecycle_manager:
  ros__parameters:
    use_sim_time: True
    autostart: True
    node_names:
      - controller_server
      - planner_server
      - behavior_server
      - bt_navigator
      - velocity_smoother