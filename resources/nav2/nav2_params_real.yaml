bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: base
    odom_topic: /odom

controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.0
    min_y_velocity_threshold: 0.0
    min_theta_velocity_threshold: 0.0
    odom_topic: /odom
    cmd_vel_topic: /cmd_vel_nav
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.001
      movement_time_allowance: 60.0
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: False
      xy_goal_tolerance: 0.5
      yaw_goal_tolerance: 0.5
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 56
      model_dt: 0.1
      batch_size: 2000
      iteration_count: 2
      temperature: 0.1
      transform_tolerance: 0.2
      motion_model: "Omni"
      critics: [
        "ConstraintCritic",
        "CostCritic",
        "PathAlignCritic",
        "PathFollowCritic",
        "PathAngleCritic",
        "GoalCritic",
        "GoalAngleCritic"
      ]
      ConstraintCritic:
        enabled: true
        cost_weight: 4.0
      CostCritic:
        enabled: true
        cost_weight: 8.0
        critical_cost: 300.0
        collision_cost: 1000000.0
        consider_footprint: true
        near_goal_distance: 1.0

planner_server:
  ros__parameters:
    allow_partial_planning: true
    use_sim_time: False
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      tolerance: 0.5
      allow_unknown: true

behavior_server:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: base
    local_frame: odom
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: False
      global_frame: odom
      robot_base_frame: base
      footprint: "[[0.36, 0.20], [0.36, -0.20], [-0.36, -0.20], [-0.36, 0.20]]"
      rolling_window: True
      footprint_padding: 0.08
      width: 4
      height: 4
      resolution: 0.1
      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /utlidar/cloud
          data_type: PointCloud2
          marking: True
          clearing: True
          obstacle_max_range: 10.0
          raytrace_max_range: 10.0
          obstacle_min_range: 0.7
          raytrace_min_range: 0.7
          min_obstacle_height: 0.1
          max_obstacle_height: 8.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.0
        inflation_radius: 0.40

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: False
      global_frame: map
      robot_base_frame: base
      footprint: "[[0.36, 0.20], [0.36, -0.20], [-0.36, -0.20], [-0.36, 0.20]]"
      footprint_padding: 0.10
      map_vis_z: -0.0
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /grid_prob_map
        map_subscribe_transient_local: True

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /utlidar/cloud
          data_type: PointCloud2
          marking: True
          clearing: True
          obstacle_max_range: 7.0
          raytrace_max_range: 10.0
          obstacle_min_range: 0.7
          raytrace_min_range: 0.7
          min_obstacle_height: 0.2
          max_obstacle_height: 10.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.0
        inflation_radius: 0.70

map_server:
  ros__parameters:
    use_sim_time: False
    topic_name: /grid_prob_map
    yaml_filename: ""

amcl:
  ros__parameters:
    use_sim_time: False

lifecycle_manager:
  ros__parameters:
    use_sim_time: False
    autostart: True
    node_names:
      - controller_server
      - planner_server
      - behavior_server
      - bt_navigator
      - velocity_smoother